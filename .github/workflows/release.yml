# Manually build and release artifacts instead of using tauri-actions
# Reasons:
# 1. Include OS name in output filenames (tauri-actions doesn't support this)
# 2. Publish portable .exe for Windows (unsupported by tauri-actions either)
name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Version-Check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      
      - name: Check version consistency
        run: pnpm run version check

      - name: Check Tag Version
        id: check-tag
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Package version: $PKG_VERSION"
          
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_VERSION="${{ github.ref_name }}"
            TAG_VERSION=${TAG_VERSION#v}
            
            if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
              echo "❌ Git tag version ($TAG_VERSION) does not match package version ($PKG_VERSION)"
              exit 1
            fi
            echo "✅ Git tag version matches package version: $TAG_VERSION"
          else
            COMMIT_HASH=$(git rev-parse HEAD)
            COMMIT_HASH=${COMMIT_HASH:0:6}
            PKG_VERSION="$PKG_VERSION"-"$COMMIT_HASH"
            echo "Not a tag, using package version with commit hash: $PKG_VERSION"
          fi
          
          # Set the version as output
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT

  Build-and-Release:
    needs: [Version-Check]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.Version-Check.outputs.version }}
      branch: ${{ github.ref }}
      upload_artifacts: true
    secrets:
      SJMCL_CURSEFORGE_API_KEY: ${{ secrets.SJMCL_CURSEFORGE_API_KEY }}

  Code-Sign-macOS:
    needs: [Version-Check, Build-and-Release]
    uses: ./.github/workflows/sign-macos.yml
    with:
      version: ${{ needs.Version-Check.outputs.version }}
    secrets:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}

  Code-Sign-Windows:
    needs: [Version-Check, Build-and-Release]
    uses: ./.github/workflows/sign-windows.yml
    with:
      version: ${{ needs.Version-Check.outputs.version }}
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  Create-Release:
    needs: [Version-Check, Build-and-Release, Code-Sign-macOS, Code-Sign-Windows]
    if: always() && needs.Build-and-Release.result == 'success'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download base artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'SJMCL_${{ needs.Version-Check.outputs.version }}_*'
          path: artifacts
          merge-multiple: true

      - name: Download signed Windows artifacts
        if: needs.Code-Sign-Windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: 'SJMCL_${{ needs.Version-Check.outputs.version }}_windows_*_signed'
          path: artifacts-signed-windows
          merge-multiple: true

      - name: Download signed macOS artifacts
        if: needs.Code-Sign-macOS.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: 'SJMCL_${{ needs.Version-Check.outputs.version }}_macos_*_signed'
          path: artifacts-signed-macos
          merge-multiple: true

      - name: Organize release artifacts
        env:
          VERSION: ${{ needs.Version-Check.outputs.version }}
          MACOS_SIGNING_SUCCESS: ${{ needs.Code-Sign-macOS.result == 'success' }}
          WINDOWS_SIGNING_SUCCESS: ${{ needs.Code-Sign-Windows.result == 'success' }}
        run: |
          mkdir -p release-artifacts
          
          # Copy Linux artifacts
          find artifacts -name "SJMCL_${{ env.VERSION }}_linux_*" -exec cp {} release-artifacts/ \;
          
          # Copy Windows artifacts (signed if available, unsigned otherwise)
          WIN_SIGNED=false
          if [ "${{ env.WINDOWS_SIGNING_SUCCESS }}" = "true" ] && [ -d artifacts-signed-windows ]; then
            WIN_FILE_COUNT=$(find artifacts-signed-windows -name "SJMCL_${{ env.VERSION }}_windows_*" -type f | wc -l)
            if [ "$WIN_FILE_COUNT" -gt 0 ]; then
              echo "Using signed Windows artifacts ($WIN_FILE_COUNT files)"
              find artifacts-signed-windows -name "SJMCL_${{ env.VERSION }}_windows_*" -type f -exec cp {} release-artifacts/ \;
              WIN_SIGNED=true
            fi
          fi

          if [ "$WIN_SIGNED" != "true" ]; then
            echo "⚠️ WARNING: Using unsigned Windows artifacts (signing failed or was skipped)"
            find artifacts -name "SJMCL_${{ env.VERSION }}_windows_*" -exec cp {} release-artifacts/ \;
          fi

          # Copy macOS artifacts (signed if available, unsigned otherwise)
          if [ "${{ env.MACOS_SIGNING_SUCCESS }}" = "true" ] && [ -d artifacts-signed-macos ]; then
            echo "Using signed macOS artifacts"
            # Copy signed macOS artifacts (rename to remove _signed suffix)
            find artifacts-signed-macos -name "SJMCL_${{ env.VERSION }}_macos_*" -type f | while read file; do
              basename=$(basename "$file")
              newname=$(echo "$basename" | sed 's/_signed\./\./')
              cp "$file" "release-artifacts/$newname"
            done
          else
            echo "⚠️ WARNING: Using unsigned macOS artifacts (signing failed or was skipped)"
            find artifacts -name "SJMCL_${{ env.VERSION }}_macos_*" -exec cp {} release-artifacts/ \;
          fi

          # Collect all SHA256 files into one summary
          touch SHA256SUMS.txt
          echo "# Version: ${{ env.VERSION }}" >> SHA256SUMS.txt
          echo "# Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> SHA256SUMS.txt
          echo "" >> SHA256SUMS.txt
          
          # Collect SHA256 from downloaded base artifacts (Linux, and unsigned Windows/macOS if any)
          find artifacts -name "*.sha256" -type f | sort | while read sha256_file; do
            # If signed Windows is available, skip unsigned Windows sha256
            if [ "$WIN_SIGNED" = "true" ] && [[ "$sha256_file" == *"_windows_"* ]]; then
              continue
            fi
            # If signed macOS is available, skip unsigned macOS sha256
            if [ "${{ env.MACOS_SIGNING_SUCCESS }}" = "true" ] && [[ "$sha256_file" == *"_macos_"* ]]; then
              continue
            fi
            cat "$sha256_file" >> SHA256SUMS.txt
          done

          # Also collect from signed Windows artifacts if available
          if [ "$WIN_SIGNED" = "true" ] && [ -d artifacts-signed-windows ]; then
            find artifacts-signed-windows -name "*.sha256" -type f | sort | while read sha256_file; do
              cat "$sha256_file" >> SHA256SUMS.txt
            done
          fi
          
          # Also collect from signed macOS artifacts if available
          if [ "${{ env.MACOS_SIGNING_SUCCESS }}" = "true" ] && [ -d artifacts-signed-macos ]; then
            find artifacts-signed-macos -name "*.sha256" -type f | sort | while read sha256_file; do
              cat "$sha256_file" >> SHA256SUMS.txt
            done
          fi

          rm -f release-artifacts/*.sha256

          echo ""
          echo "Core executable SHA256 checksums:"
          cat SHA256SUMS.txt

          echo "Final release artifacts:"
          ls -la release-artifacts/

      # Only upload to SJMC server for the main repository
      - name: Upload artifacts to SJMC server
        if: github.repository == 'UNIkeEN/SJMCL'
        timeout-minutes: 10
        env:
          SJMC_SECRET_KEY: ${{ secrets.SJMC_DEPLOY_SECRET_KEY }}
          SJMC_DEPLOY_API: ${{ secrets.SJMC_DEPLOY_API }}
          SJMC_DEPLOY_PROJECT: ${{ secrets.SJMC_DEPLOY_PROJECT }}
          VERSION: ${{ needs.Version-Check.outputs.version }}
        run: |
          SHA256SUMS_FILE=SHA256SUMS_${{ env.VERSION }}.txt
          cp SHA256SUMS.txt release-artifacts/${SHA256SUMS_FILE}
          bash scripts/release/upload_to_sjmc_server.sh
          rm release-artifacts/${SHA256SUMS_FILE}
        shell: bash

      - name: Generate Changelog
        id: changelog
        env:
          MACOS_SIGNING_SUCCESS: ${{ needs.Code-Sign-macOS.result == 'success' }}
          WINDOWS_SIGNING_SUCCESS: ${{ needs.Code-Sign-Windows.result == 'success' }}
        run: |
          pip install requests packaging
          python scripts/release/generate_changelog_draft.py > release-notes.md
          
          # Add warning if Windows signing failed or was skipped
          WIN_FILE_COUNT=0
          if [ -d artifacts-signed-windows ]; then
            WIN_FILE_COUNT=$(find artifacts-signed-windows -name "SJMCL_${{ needs.Version-Check.outputs.version }}_windows_*" -type f | wc -l)
          fi
          if [ "${{ env.WINDOWS_SIGNING_SUCCESS }}" != "true" ] || [ "$WIN_FILE_COUNT" -eq 0 ]; then
            echo "" >> release-notes.md
            echo "---" >> release-notes.md
            echo "" >> release-notes.md
            echo "⚠️ **Note:** Windows artifacts in this release are **not code-signed**. Windows SmartScreen may show security warnings when running the installer or portable application." >> release-notes.md
          fi

          # Add warning if macOS signing failed or was skipped
          if [ "${{ env.MACOS_SIGNING_SUCCESS }}" != "true" ]; then
            echo "" >> release-notes.md
            echo "---" >> release-notes.md
            echo "" >> release-notes.md
            echo "⚠️ **Note:** macOS artifacts in this release are **not code-signed**. macOS users may see security warnings when running the application." >> release-notes.md
          fi
        shell: bash

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.Version-Check.outputs.version }}
        run: |
          # Create the release
          gh release create "$GITHUB_REF_NAME" \
            --title "SJMCL ${{ env.VERSION }}" \
            --draft \
            --notes-file release-notes.md \
            ./release-artifacts/*
