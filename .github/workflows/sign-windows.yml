name: Sign Windows Artifacts
permissions:
  contents: read
  actions: read

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to sign'
        required: true
        type: string
    secrets:
      SIGNPATH_API_TOKEN:
        description: 'SignPath API token'
        required: false

jobs:
  sign-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x86_64
          - os: windows-latest
            target: i686-pc-windows-msvc
            arch: i686
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Validate signing configuration
        id: validate
        shell: bash
        run: |
          MISSING_CONFIGS=()

          if [ -z "${{ secrets.SIGNPATH_API_TOKEN }}" ]; then
            MISSING_CONFIGS+=("SIGNPATH_API_TOKEN")
          fi
          if [ -z "${{ vars.SIGNPATH_ORGANIZATION_ID }}" ]; then
            MISSING_CONFIGS+=("SIGNPATH_ORGANIZATION_ID")
          fi
          if [ -z "${{ vars.SIGNPATH_PROJECT_SLUG }}" ]; then
            MISSING_CONFIGS+=("SIGNPATH_PROJECT_SLUG")
          fi
          if [ -z "${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}" ]; then
            MISSING_CONFIGS+=("SIGNPATH_SIGNING_POLICY_SLUG")
          fi
          if [ -z "${{ vars.SIGNPATH_WINDOWS_CORE_CONFIG }}" ]; then
            MISSING_CONFIGS+=("SIGNPATH_WINDOWS_CORE_CONFIG")
          fi
          if [ -z "${{ vars.SIGNPATH_WINDOWS_FINAL_CONFIG }}" ]; then
            MISSING_CONFIGS+=("SIGNPATH_WINDOWS_FINAL_CONFIG")
          fi

          if [ ${#MISSING_CONFIGS[@]} -gt 0 ]; then
            echo "::warning::⚠️ Windows code signing will be skipped - missing secrets/variables: ${MISSING_CONFIGS[*]}"
            echo "The release will continue with unsigned Windows artifacts."
            echo "should_sign=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ All required SignPath configuration parameters are present."
            echo "should_sign=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Download Windows build input
        uses: actions/download-artifact@v4
        with:
          name: windows-build-input-${{ inputs.version }}-${{ matrix.arch }}
          path: windows-build-input

      - name: Restore build binaries and assets
        shell: bash
        run: |
          mkdir -p "src-tauri/target/${{ matrix.target }}/release"
          cp "windows-build-input/app/SJMCL.exe" "src-tauri/target/${{ matrix.target }}/release/SJMCL.exe"
          cp "windows-build-input/app/SJMCL.exe" "src-tauri/target/${{ matrix.target }}/release/SJMCL-unsigned.exe"
          cp -r "windows-build-input/out" "./out"

      - name: Prepare unsigned main executable for signing
        if: steps.validate.outputs.should_sign == 'true'
        shell: bash
        run: |
          mkdir -p signing-main-input
          cp "src-tauri/target/${{ matrix.target }}/release/SJMCL.exe" signing-main-input/SJMCL.exe

      - name: Upload unsigned main executable
        if: steps.validate.outputs.should_sign == 'true'
        id: upload-main-app
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-main-app-${{ matrix.arch }}
          path: signing-main-input/SJMCL.exe
          if-no-files-found: error

      - name: Sign main executable
        if: steps.validate.outputs.should_sign == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_WINDOWS_CORE_CONFIG }}
          github-artifact-id: ${{ steps.upload-main-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-main-output

      - name: Apply signed main executable
        if: steps.validate.outputs.should_sign == 'true'
        shell: bash
        run: |
          cp signed-main-output/SJMCL.exe "src-tauri/target/${{ matrix.target }}/release/SJMCL.exe"

      - name: Bundle NSIS installer
        run: |
          pnpm tauri bundle --target ${{ matrix.target }} --bundles nsis --no-binary-patching --no-sign

      - name: Bundle portable executable
        shell: bash
        run: |
          mkdir -p "src-tauri/target/${{ matrix.target }}/release/assets"
          cp -r src-tauri/assets/* "src-tauri/target/${{ matrix.target }}/release/assets/"
          python scripts/release/bundle_portable_assets.py -p "src-tauri/target/${{ matrix.target }}/release/" -o "SJMCL-patched.exe" "SJMCL-unsigned.exe"

      - name: Prepare final artifacts for signing
        shell: bash
        run: |
          mkdir -p signing-final-input
          cp "src-tauri/target/${{ matrix.target }}/release/SJMCL-patched.exe" signing-final-input/SJMCL-patched.exe
          cp "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/"*.exe signing-final-input/SJMCL-setup.exe

      - name: Upload unsigned final Windows artifacts
        if: steps.validate.outputs.should_sign == 'true'
        id: upload-final-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-final-windows-${{ matrix.arch }}
          path: signing-final-input/
          if-no-files-found: error

      - name: Sign final Windows artifacts
        if: steps.validate.outputs.should_sign == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_WINDOWS_FINAL_CONFIG }}
          github-artifact-id: ${{ steps.upload-final-artifacts.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-final-output

      - name: Organize release artifacts and calculate SHA256
        shell: bash
        run: |
          mkdir -p artifacts
          ARTIFACT_BASE="SJMCL_${{ inputs.version }}_windows_${{ matrix.arch }}"

          if [ "${{ steps.validate.outputs.should_sign }}" = "true" ] && [ -d signed-final-output ]; then
            echo "Using signed Windows artifacts"
            cp signed-final-output/SJMCL-setup.exe "artifacts/${ARTIFACT_BASE}_setup.exe"
            cp signed-final-output/SJMCL-patched.exe "artifacts/${ARTIFACT_BASE}_portable.exe"
          else
            echo "Using unsigned Windows artifacts"
            cp signing-final-input/SJMCL-setup.exe "artifacts/${ARTIFACT_BASE}_setup.exe"
            cp signing-final-input/SJMCL-patched.exe "artifacts/${ARTIFACT_BASE}_portable.exe"
          fi

          echo "$(sha256sum "artifacts/${ARTIFACT_BASE}_setup.exe" | awk '{print $1}') ${ARTIFACT_BASE}" > "artifacts/${ARTIFACT_BASE}.sha256"
          echo "$(sha256sum "artifacts/${ARTIFACT_BASE}_portable.exe" | awk '{print $1}') ${ARTIFACT_BASE}_portable" >> "artifacts/${ARTIFACT_BASE}.sha256"

          echo "Generated SHA256:"
          cat "artifacts/${ARTIFACT_BASE}.sha256"
          ls -la artifacts/

      - name: Upload signed Windows artifacts
        if: steps.validate.outputs.should_sign == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SJMCL_${{ inputs.version }}_windows_${{ matrix.arch }}_signed
          path: artifacts/*
          if-no-files-found: error

      - name: Upload unsigned Windows artifacts
        if: steps.validate.outputs.should_sign != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SJMCL_${{ inputs.version }}_windows_${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
